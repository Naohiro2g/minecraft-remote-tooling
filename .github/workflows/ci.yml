name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build WireScope artifact
        run: npm run build:artifact --workspace=@mc-remote/live -- --source-commit "${{ github.sha }}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: mkdir -p artifacts
      - name: Build Bridge OCI archive
        id: bridge
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/bridge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=artifacts/bridge.oci.tar
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            RELEASE_VERSION=sha-${{ github.sha }}
      - name: Record candidate identity
        run: node scripts/build-candidate-manifest.mjs "${{ github.sha }}" "${{ steps.bridge.outputs.digest }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tooling-${{ github.sha }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
